name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build src/L5ArgentinaLauncher.csproj -c Release --nologo

      # El self-test (manifest/hash/zip-slip/backups) sólo existe en Debug.
      - name: Self-test (Debug)
        shell: pwsh
        run: |
          dotnet build src/L5ArgentinaLauncher.csproj -c Debug --nologo
          $exe = "src/bin/Debug/net48/L5ArgentinaLauncher.exe"
          $report = "$env:RUNNER_TEMP/selftest.txt"
          & $exe --selftest $report | Out-Null
          $code = $LASTEXITCODE
          Get-Content $report
          if ($code -ne 0) { throw "Self-test falló" }
          # Un SKIP significa que el harness no encontró las fixtures de tests/fixtures/ y se
          # salteó los golden tests de paridad, SIN fallar (exit code 0). En CI el repo siempre
          # está, así que un SKIP acá es un error de rutas que dejaría la batería a medias.
          $skips = @(Select-String -Path $report -Pattern '^SKIP:')
          if ($skips.Count -gt 0) { throw "Self-test incompleto: $($skips.Count) bloque(s) salteado(s) — revisar las rutas de tests/fixtures/ en SelfTest.cs" }
